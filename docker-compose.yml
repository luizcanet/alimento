services:
  web:
    image: nginx
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/server.conf:/etc/nginx/conf.d/server.conf:ro
      - ./cert.crt:/etc/ssl/cert.crt:ro
      - ./cert.key:/etc/ssl/cert.key:ro
      - ./src:/var/www
      - ./node_modules:/var/www/modules
    ports:
      - "443:443"