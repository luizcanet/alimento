name: Test

on: [pull_request]

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js 20
      uses: actions/setup-node@v1
      with:
        node-version: '20.x'
    - run: npm install
    - run: npm run lint
    - run: npm test
